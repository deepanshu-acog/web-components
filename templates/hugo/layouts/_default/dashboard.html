{{ define "main" }}
<div class="dashboard-layout-container wa-stack wa-gap-l">
  {{ partial "breadcrumbs.html" . }}

  <header style="margin-block-end: var(--wa-space-m); border-block-end: 2px solid var(--wa-color-surface-border); padding-block-end: var(--wa-space-m);">
    <div class="wa-split" style="align-items: center; margin-block-end: var(--wa-space-2xs);">
      <h1 style="font-family: var(--wa-font-family-heading); font-size: var(--wa-font-size-2xl); margin: 0;">📊 {{ .LinkTitle }}</h1>
      <wa-badge variant="success">Live Executive Dashboard</wa-badge>
    </div>
    {{ partial "meta.html" . }}
  </header>

  <div class="dashboard-body">
    {{ .Content }}
  </div>
</div>
{{ end }}
